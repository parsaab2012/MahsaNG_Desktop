name: Release

on:
  push:
    tags: ["v*", "preview-*"]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload build artifacts to"
        required: true
        default: "preview-0.3.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: mahsang-linux-amd64.tar.gz

          - os: windows-2025
            asset: mahsang-windows-amd64.zip

          - os: macos-15
            asset: mahsang-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Run tests
        run: go test ./...

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o mahsang ./cmd/mahsang

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o mahsang.exe ./cmd/mahsang

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}" mahsang

      - name: Package with wintun.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-extract
          Copy-Item wintun-extract/wintun/bin/amd64/wintun.dll .
          Compress-Archive -Path mahsang.exe, wintun.dll -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(mahsang-*.tar.gz mahsang-*.zip)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No build packages were downloaded."
            exit 1
          fi

          echo "Uploading packages to: $RELEASE_TAG"
          printf 'Found package: %s\n' "${files[@]}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            if [[ "$RELEASE_TAG" == preview-* ]]; then
              version="${RELEASE_TAG#preview-}"
              gh release create "$RELEASE_TAG" "${files[@]}" \
                --title "MahsaNG Desktop v${version} — Preview" \
                --generate-notes --prerelease --verify-tag
            else
              gh release create "$RELEASE_TAG" "${files[@]}" \
                --title "MahsaNG Desktop ${RELEASE_TAG}" \
                --generate-notes --verify-tag
            fi
          fi
