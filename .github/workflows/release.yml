name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: mahsang-linux-amd64.tar.gz

          - os: windows-2025
            asset: mahsang-windows-amd64.zip

          - os: macos-15
            asset: mahsang-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Run tests
        run: go test ./...

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o mahsang ./cmd/mahsang

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o mahsang.exe ./cmd/mahsang

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}" mahsang

      - name: Package with wintun.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-extract
          Copy-Item wintun-extract/wintun/bin/amd64/wintun.dll .
          Compress-Archive -Path mahsang.exe, wintun.dll -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          name: MahsaNG Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            mahsang-*.tar.gz
            mahsang-*.zip
